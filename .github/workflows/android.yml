# Builds the Android app (APK) and publishes it as a GitHub Release, so it can be
# downloaded and installed straight from a phone: github.com/kipkechem/Chips/releases/latest
name: Android app

on:
  push:
    branches: [main, 'claude/**', 'codex/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        levels: ['1-10', '11-20', '21-30', '31-40']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check rules, progress migration, and map structure
        run: npm test
      - name: Validate exact pars or best known authored routes
        run: node tools/solve.js ${{ matrix.levels }}
      - run: npx playwright install --with-deps chromium
      - name: Replay the pack in the browser with sequential unlocking
        run: node tools/test-browser.js ${{ matrix.levels }} --strategies
      - name: Check campaign UI on mobile and desktop
        if: matrix.levels == '31-40'
        run: |
          node tools/test-ui.js
          node tools/test-pack1.js --pack-only
          node tools/build-pack1-proofs.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.levels }}
          path: .cache/
          include-hidden-files: true
          retention-days: 14

  apk:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: validation-31-40
          path: .validation

      - name: Prepare the decision validation report
        run: cp .validation/qa/pack1-decisions.json Pack1-validation.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm ci --no-audit --no-fund

      - name: Bundle the game for the app
        run: node tools/build-web.js
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Check production sources and exclude development fixtures
        run: node tools/test-web-bundle.js

      - name: Create the Android project
        run: npx cap add android

      - name: Lock to landscape and hide the status bar
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#</style>#    <item name="android:windowFullscreen">true</item>\n    </style>#' android/app/src/main/res/values/styles.xml
          grep -n 'screenOrientation' android/app/src/main/AndroidManifest.xml
          grep -n 'windowFullscreen' android/app/src/main/res/values/styles.xml

      - name: App icon
        continue-on-error: true
        run: npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#0a1430' --splashBackgroundColor '#070b16'

      - name: Sync the game into the Android project
        run: npx cap sync android

      # Android only installs an update over the old app when both are signed with the same
      # key, so every build is signed with the key kept in android-signing/ (named directly in
      # the app's build config). The version number goes up with every build.
      - name: Sign with the same key every time, and number the version
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file('../../android-signing/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE
          sed -i 's/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName "1.0"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle
          grep -n 'versionCode ${{ github.run_number }}' android/app/build.gradle

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Check the APK is signed with the repository key
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          got=$("$apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          want=$(keytool -exportcert -keystore android-signing/debug.keystore -alias androiddebugkey -storepass android | sha256sum | cut -d' ' -f1)
          echo "APK certificate: $got"
          echo "Repository key:  $want"
          test "$got" = "$want"

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "Lockstep-${{ github.run_number }}.apk"
          sha256sum "Lockstep-${{ github.run_number }}.apk" > "Lockstep-${{ github.run_number }}.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Lockstep-apk
          path: Lockstep-*.apk*

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Lockstep for Android (build ${{ github.run_number }})
          make_latest: true
          files: |
            Lockstep-${{ github.run_number }}.apk
            Lockstep-${{ github.run_number }}.apk.sha256
            Pack1-validation.json
          body: |
            Open this page on your Android phone and tap **Lockstep-${{ github.run_number }}.apk** to download it.
            When Android asks, allow your browser to install unknown apps, then tap Install.

            Built from `${{ github.ref_name }}` at ${{ github.sha }}.

            Replacement Pack 1, revision 2: all Levels 31 to 40 redesigned around resource decisions. Install over Build 21 without uninstalling. Existing clears survive; obsolete Pack 1 times and stars reset.

            Validation passed: 40 maps and solver routes, 33 rule tests, seven save/campaign tests, 14 complete Pack 1 strategies, 18 branch consequences, and four spare turns at all three timed commitments. Chromium replayed 40 canonical routes, four alternatives, and three delayed routes. Mobile/desktop layout, 100-level unlocking, offline assets, development-file exclusion, and the existing Android signing identity were checked.

            SHA-256 and the decision report are attached. Screenshots and full replay evidence are in the validation artifacts at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}.

            Phone playtest approval is required before Levels 41 to 50 begin.
